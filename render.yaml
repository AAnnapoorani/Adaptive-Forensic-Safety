services:
  # ─── FastAPI Backend Web Service ───────────────────────────────────────────
  - type: web
    name: jocky-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false # Set this in Render dashboard to your Supabase connection string
      - key: DEMO_MODE
        value: "false"
      - key: MAX_ROUNDS
        value: "3"

  # ─── React / Vite Frontend Static Site ─────────────────────────────────────
  - type: web
    name: jocky-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: jocky-backend
          property: host

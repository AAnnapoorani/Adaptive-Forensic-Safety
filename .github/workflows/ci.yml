name: JOCKY CI/CD Pipeline

on:
  push:
    branches: [main, dev, master]
  pull_request:
    branches: [main, dev, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: Code Quality & Linting ──────────────────────────────────────────
  code-quality:
    name: Code Quality — Flake8 & Oxlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies & linter
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install flake8
          pip install -r requirements.txt

      - name: Lint Backend (Flake8 syntax & undefined names)
        working-directory: backend
        run: |
          flake8 app/ --select=E9,F821,F822,F823 --max-line-length=120

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint Frontend (Oxlint)
        working-directory: frontend
        run: npm run lint

  # ─── Job 2: Backend Unit & Forensic Tests ────────────────────────────────────
  backend-test:
    name: Backend — Pytest & Forensic Engine Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify critical imports & collectors
        run: |
          python -c "
          from app.jocky.compiler import JockyCompiler
          from app.jocky.polymorphic import PolymorphicEngine, PayloadEncryptor
          from app.intelligence.correlation_engine import CorrelationEngine
          from app.intelligence.escalation_rules import AdaptiveEscalationEngine
          from app.intelligence.in_memory_detection import detect_in_memory_indicators
          from app.collectors.registry import list_supported_operations
          print('Imports verified. Supported operations:', len(list_supported_operations()))
          "

      - name: Run Pytest test suite (60 unit + integration tests)
        env:
          DEMO_MODE: "false"
          MAX_ROUNDS: "3"
        run: |
          python -m pytest -v --tb=short

      - name: Polymorphic Engine Verification (Unique SHA-256 Variants)
        run: |
          python -c "
          from app.jocky.polymorphic import PolymorphicEngine
          intents = [
              'INVESTIGATE suspicious_network_activity',
              'INVESTIGATE possible_malware_execution',
              'INVESTIGATE byovd_detection'
          ]
          for script in intents:
              res = PolymorphicEngine.mutate(script, iterations=5)
              assert len(set(res['hashes'])) == 5, f'Hash collision in {script}'
              assert res['original_hash'] not in res['hashes']
          print('Polymorphic engine verified: 5/5 unique hashes generated per script.')
          "

      - name: Evidence Encryption Verification (PBKDF2 + AES-128-CBC)
        run: |
          python -c "
          from app.jocky.polymorphic import PayloadEncryptor
          payload = {'pid': 4820, 'process': 'powershell.exe', 'ip': '198.51.100.44'}
          blob1 = PayloadEncryptor.encrypt(payload, 'INV-CI-001')
          blob2 = PayloadEncryptor.encrypt(payload, 'INV-CI-002')
          dec = PayloadEncryptor.decrypt(blob1, 'INV-CI-001')
          assert dec == payload, 'Decryption mismatch'
          assert blob1 != blob2, 'Different inv_id must yield different ciphertexts'
          print('Evidence payload encryption & decryption roundtrip verified.')
          "

      - name: BYOVD Correlation Rule Verification
        run: |
          python -c "
          from app.intelligence.correlation_engine import CorrelationEngine
          engine = CorrelationEngine()
          evidence = {
              'DRIVERS.LIST': [
                  {
                      'filename': 'RTCore64.sys',
                      'is_byovd_known_vulnerable': True,
                      'byovd_risk': 'CRITICAL',
                      'byovd_cve': 'CVE-2019-16098',
                      'byovd_vendor': 'MSI',
                      'byovd_technique': 'kernel rw'
                  }
              ]
          }
          matches = engine.evaluate(evidence)
          names = [m.rule_name for m in matches]
          assert 'BYOVD_VULNERABLE_DRIVER_LOADED' in names, f'Rule not fired: {names}'
          print('BYOVD detection correlation engine verified.')
          "

  # ─── Job 3: Frontend TypeScript Build ───────────────────────────────────────
  frontend-build:
    name: Frontend — TypeScript Check & Vite Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc -b

      - name: Build production bundle
        run: npm run build

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ─── Job 4: E2E API & Full Investigation Simulation ─────────────────────────
  e2e-simulation:
    name: E2E — Investigation Lifecycle & API Contract Test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute In-Process E2E API Verification
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from app.main import app

          client = TestClient(app)

          # 1. Health Endpoint
          r_health = client.get('/api/health')
          assert r_health.status_code == 200, f'Health failed: {r_health.text}'
          assert r_health.json()['status'] == 'healthy'
          print('[PASS] Health check OK')

          # 2. Polymorphic Mutate Endpoint
          r_mut = client.post('/api/jocky/mutate', json={
              'script': 'INVESTIGATE suspicious_network_activity',
              'iterations': 3
          })
          assert r_mut.status_code == 200, f'Mutate failed: {r_mut.text}'
          assert r_mut.json()['all_hashes_unique'] is True
          print('[PASS] Mutate API OK')

          # 3. Encrypt & Decrypt Endpoint
          r_enc = client.post('/api/jocky/encrypt', json={
              'payload': {'pid': 1337, 'name': 'svchost.exe'},
              'investigation_id': 'INV-CI-TEST'
          })
          assert r_enc.status_code == 200
          enc_blob = r_enc.json()['encrypted_blob']

          r_dec = client.post('/api/jocky/decrypt', json={
              'encrypted_blob': enc_blob,
              'investigation_id': 'INV-CI-TEST'
          })
          assert r_dec.status_code == 200
          assert r_dec.json()['payload'] == {'pid': 1337, 'name': 'svchost.exe'}
          print('[PASS] Encrypt/Decrypt API OK')

          # 4. Drivers / BYOVD Endpoint
          r_drv = client.get('/api/jocky/drivers')
          assert r_drv.status_code == 200
          assert r_drv.json()['operation'] == 'DRIVERS.LIST'
          print('[PASS] Drivers API OK')

          # 5. Full Autonomous Investigation Lifecycle in Demo Mode
          r_inv = client.post('/api/investigations', json={'intent': 'byovd_detection'})
          assert r_inv.status_code == 200
          inv_id = r_inv.json()['id']
          print(f'[PASS] Created investigation: {inv_id}')

          r_exec = client.post(f'/api/investigations/{inv_id}/execute?demo=true')
          assert r_exec.status_code == 200
          exec_res = r_exec.json()
          assert exec_res['status'] == 'COMPLETED'
          assert exec_res['rounds_executed'] >= 1
          print(f'[PASS] Investigation executed: {exec_res[\"rounds_executed\"]} rounds, {exec_res[\"artifacts_collected\"]} artifacts')

          r_corr = client.get(f'/api/investigations/{inv_id}/correlations')
          assert r_corr.status_code == 200
          corrs = r_corr.json()
          assert len(corrs) > 0
          print(f'[PASS] Correlations verified: {len(corrs)} rules matched')

          print('=== ALL E2E API VERIFICATIONS PASSED ===')
          "

  # ─── Job 5: Docker Container Build Verification ─────────────────────────────
  docker-build:
    name: Docker — Container Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Backend Docker Image
        run: docker build -t jocky-backend:ci backend/

      - name: Build Frontend Docker Image
        run: docker build -t jocky-frontend:ci frontend/
